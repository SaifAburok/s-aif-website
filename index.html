<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saif Aburok | Gaza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), 
                        url('https://i.ibb.co/rKnjPxyW/5d4c534628273a263b195e4b4d219bba.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .card {
            width: 90%;
            max-width: 380px;
            text-align: center;
            padding: 25px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(191, 160, 131, 0.2);
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #bfa083; 
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 26px;
            letter-spacing: 2px;
            color: #bfa083;
            margin: 10px 0;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .subtitle {
            font-size: 13px;
            letter-spacing: 2px;
            color: #d1b9a1;
            margin-bottom: 35px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }
        .link-btn {
            display: flex;
            align-items: center;
            background-color: #bfa083;
            color: #fff;
            text-decoration: none;
            padding: 14px 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
        .link-btn i {
            font-size: 20px;
            width: 25px;
            text-align: center;
        }
        .link-btn span {
            flex-grow: 1;
            text-align: center;
        }
        .link-btn:hover {
            background-color: #d1b9a1;
            color: #120d0a;
            transform: translateY(-4px);
            box-shadow: 0px 8px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.ibb.co/GvCh0mXq/f73a00a4d003610bdba2ba7220c8d219.jpg" alt="Saif Aburok" class="profile-img"> 
        
        <h1>SAIF ABUROK</h1>
        <div class="subtitle">GAZA: AN ENGINEERED WILL</div>

        <a href="https://www.instagram.com/se__nj_rk?igsh=ZHlrc2Y2a211ZnB0" target="_blank" class="link-btn">
            <i class="fab fa-instagram"></i>
            <span>INSTAGRAM</span>
        </a>

        <a href="https://x.com/RokSeif" target="_blank" class="link-btn">
            <i class="fab fa-x-twitter"></i>
            <span>TWITTER</span>
        </a>

        <a href="https://chuffed.org/project/support-seif" target="_blank" class="link-btn">
            <i class="fas fa-hand-holding-heart"></i>
            <span>DONATE HERE</span>
        </a>

        <a href="https://www.tickettailor.com/events/palestijnsdag/1880866" target="_blank" class="link-btn">
            <i class="fas fa-book-open"></i>
            <span>MY BOOK</span>
        </a>
    </div>

</body>
</html>
